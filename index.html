<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>

  <section class="container">
    <div class="quize-container">
      <div class="home" id="home-page">
        <h1 class="home-heading">Quizzo</h1>
        <p class="home-title">A simple Quiz app</p>
        <img src="./src/images/question.png" alt="">
        <p class="home-title">Test Your Knowledge with Quizzo</p>
        <button id="start-btn">Let's Start</button>
      </div>
      <div id="quiz-page">
        <div class="questions-content">
          <div class="questions">
            <div>
              <img class="quiz-emoji" src="./src/images/emoji.png" alt="">
              <p class="question-length"><span id="question-count"></span>/10</p>
            </div>
            <h1 id="question"></h1>
            <div class="option-container" id="options">

            </div>
            <button id="next-btn">Next
              <img src="./src/images/next.png" alt="">
            </button>
          </div>
        </div>
      </div>

      <div class="score" id="score-page">
        <div class="score-container">
          <img class="trophy" src="./src/images/trophy.png" alt="">
          <h1>Your score <span id="score-count"></span></h1>
          <div class="score-page-btn">
            <button id="go-home">Home</button>
            <button id="paly-again">Play again</button>
          </div>
        </div>
      </div>
  </section>
  <script src="./src/quiz.js"></script>
</body>

</html>
